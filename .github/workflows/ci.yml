name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Skill tests are excluded here and run once, in the single cell below.
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --ignore-glob='*test_skill_*.py'

      # The skill tests assert Python-level API facts, file checksums, and that
      # the bundled examples execute -- none of which is platform-specific, so
      # one cell is enough. Running the 8 examples on all 15 adds cost, not signal.
      - name: Skill checks
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m pytest tests/test_skill_contract.py tests/test_skill_bundle.py tests/test_skill_examples.py -v --tb=short

      # Same exclusion as "Run tests": the skill tests have their own step above,
      # so without this a single skill failure reddens three steps on this cell.
      # Excluding them costs one statement of coverage (94% either way).
      - name: Run tests with coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -m pytest tests/ --ignore-glob='*test_skill_*.py' --cov=odmlib --cov-report=xml --cov-report=term-missing

      - name: Check coverage threshold
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -m pytest tests/ --ignore-glob='*test_skill_*.py' --cov=odmlib --cov-fail-under=90

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Type checking does not gate merges yet. odmlib has known mypy errors (128 in
  # 20 files when this job was added), listed in scripts/mypy_baseline.txt; the
  # job fails only on an error that is not in that list. After fixing errors,
  # shrink the list with `python scripts/mypy_baseline.py --update`. mypy is
  # pinned because another release can report a different error set. Uses
  # [tool.mypy] from pyproject.toml.
  mypy:
    name: mypy (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "mypy==2.4.1"

      - name: Run mypy against the baseline
        run: python scripts/mypy_baseline.py
